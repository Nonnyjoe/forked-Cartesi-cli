services:
    launchpad:
        image: cartesi/rollups-launchpad:devel
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/"]
            start_period: 10s
            start_interval: 200ms
            interval: 10s
            timeout: 1s
            retries: 5

    proxy:
        volumes:
            - ./proxy/launchpad.yaml:/etc/traefik/conf.d/launchpad.yaml
